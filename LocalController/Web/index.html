<!DOCTYPE html>
<html lang="vi" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PC Remote Control</title>
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="/local_controller.png">
    <link rel="apple-touch-icon" href="/local_controller.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PC Remote">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Utilities not in Tailwind */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
            height: 100%;
            touch-action: auto;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 9999px;
            background: transparent;
            border: 0;
            cursor: pointer;
        }

        input[type=range]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 9999px;
            background: transparent;
            border: 0;
            cursor: pointer;
        }

        input[type=range]::-moz-range-track {
            background: transparent;
            border: 0;
        }

        input[type=range]:focus {
            outline: none;
        }
        
        /* Smooth transitions */
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Native-like feel */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Prevent bounce scroll on mobile */
        body {
            overscroll-behavior-y: none;
        }

        /* Prevent double-tap zoom on buttons and inputs */
        button, input {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen selection:bg-indigo-500 selection:text-white transition-colors duration-300 select-none">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4 sm:p-6 gap-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center py-2">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">PC Remote</h1>
                <div id="connectionStatus" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700 mt-1 transition-colors">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-600 animate-pulse"></span>
                    Connected
                </div>
            </div>
            
            <button id="manualRefreshBtn" class="group relative w-10 h-10 rounded-full bg-white shadow-sm border border-gray-100 flex items-center justify-center hover:shadow-md active:scale-95 transition-all duration-200 overflow-hidden">
                <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 40 40">
                    <circle class="text-gray-100" stroke-width="3" stroke="currentColor" fill="transparent" r="16" cx="20" cy="20"/>
                    <circle id="refreshProgress" class="text-indigo-600 transition-all duration-300 ease-linear" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" stroke="currentColor" fill="transparent" r="16" cx="20" cy="20"/>
                </svg>
                <span class="material-icons-round text-gray-600 group-hover:text-indigo-600 transition-colors z-10 text-xl" id="refreshIcon">refresh</span>
            </button>
        </header>

        <main class="flex-1 flex flex-col gap-5">
            
            <!-- Media Card -->
            <section class="relative overflow-hidden rounded-3xl bg-indigo-600 text-white shadow-xl shadow-indigo-200">
                <!-- Background Decoration -->
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-40 h-40 rounded-full bg-white opacity-5 blur-2xl"></div>
                <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-40 h-40 rounded-full bg-white opacity-5 blur-2xl"></div>
                
                <div class="relative p-6 flex flex-col gap-6">
                    <div class="flex items-start gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center shadow-inner border border-white/10 shrink-0">
                            <span class="material-icons-round text-3xl text-white/90">music_note</span>
                        </div>
                        <div class="flex-1 min-w-0 pt-0.5">
                            <h2 id="mediaTitle" class="text-lg font-semibold leading-tight truncate">No Media Playing</h2>
                            <p id="mediaArtist" class="text-indigo-100 text-sm truncate mt-1 opacity-80">Unknown Artist</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between px-2">
                        <button id="btnPrev" class="w-12 h-12 rounded-full flex items-center justify-center text-white/70 hover:text-white hover:bg-white/10 active:bg-white/20 transition-all">
                            <span class="material-icons-round text-3xl">skip_previous</span>
                        </button>
                        
                        <button id="btnPlayPause" class="w-16 h-16 rounded-full bg-white text-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-900/20 hover:scale-105 active:scale-95 transition-all duration-200">
                            <span id="iconPlayPause" class="material-icons-round text-4xl ml-0.5">play_arrow</span>
                        </button>
                        
                        <button id="btnNext" class="w-12 h-12 rounded-full flex items-center justify-center text-white/70 hover:text-white hover:bg-white/10 active:bg-white/20 transition-all">
                            <span class="material-icons-round text-3xl">skip_next</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Volume Card -->
            <section class="rounded-3xl bg-white p-6 shadow-lg shadow-gray-100 border border-gray-100">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2.5 text-gray-500">
                        <div class="p-2 bg-gray-50 rounded-lg">
                            <span class="material-icons-round text-xl">volume_up</span>
                        </div>
                        <span class="text-sm font-semibold uppercase tracking-wider">Volume</span>
                    </div>
                    <span id="volumeValue" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">50%</span>
                </div>
                
                <div class="flex items-center gap-3">
                    <button id="btnMute" class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-50 transition-all">
                        <span id="iconMute" class="material-icons-round">volume_up</span>
                    </button>
                    
                    <div class="flex-1 relative h-12 flex items-center">
                        <div class="absolute w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div id="volumeFill" class="h-full bg-indigo-500 rounded-full w-1/2"></div>
                        </div>
                        <input type="range" id="volumeSlider" min="0" max="100" value="50" class="absolute w-full h-full opacity-0 cursor-pointer z-10">
                        
                        <!-- Custom Thumb visual (optional, implemented via CSS usually, but here we use simple div overlay if needed or rely on default invisible thumb interaction with visible track) -->
                        <div id="volumeThumb" class="absolute h-5 w-5 bg-white border-2 border-indigo-500 rounded-full shadow-md pointer-events-none left-1/2 -ml-2.5"></div>
                    </div>
                </div>
                
                <div class="flex justify-between gap-3 mt-4">
                     <button id="btnVolumeDown" class="flex-1 py-2.5 rounded-xl bg-gray-50 text-gray-600 font-medium text-sm hover:bg-gray-100 active:bg-gray-200 transition-colors flex items-center justify-center gap-1">
                        <span class="material-icons-round text-base">remove</span>
                     </button>
                     <button id="btnVolumeUp" class="flex-1 py-2.5 rounded-xl bg-gray-50 text-gray-600 font-medium text-sm hover:bg-gray-100 active:bg-gray-200 transition-colors flex items-center justify-center gap-1">
                        <span class="material-icons-round text-base">add</span>
                     </button>
                </div>
            </section>

            <!-- System Card -->
            <section class="rounded-3xl bg-white p-6 shadow-lg shadow-gray-100 border border-gray-100">
                <div class="flex items-center justify-between mb-5">
                    <div class="flex items-center gap-2.5 text-gray-500">
                        <div class="p-2 bg-gray-50 rounded-lg">
                            <span class="material-icons-round text-xl">settings</span>
                        </div>
                        <span class="text-sm font-semibold uppercase tracking-wider">System</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                         <span class="w-2 h-2 rounded-full bg-gray-300" id="lockStatusDot"></span>
                         <span id="lockState" class="text-xs font-medium text-gray-500">Unknown</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button id="btnLock" class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-rose-50 text-rose-600 hover:bg-rose-100 active:scale-95 transition-all border border-rose-100">
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-rose-500">
                            <span class="material-icons-round">lock</span>
                        </div>
                        <span class="font-semibold text-sm">Lock PC</span>
                    </button>
                    
                     <!-- Placeholder for future action -->
                    <button class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-gray-50 text-gray-400 border border-gray-100 cursor-not-allowed opacity-60">
                        <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm">
                            <span class="material-icons-round">more_horiz</span>
                        </div>
                        <span class="font-semibold text-sm">More</span>
                    </button>
                </div>
            </section>
        </main>
        
        <footer class="text-center py-4">
             <p class="text-xs text-gray-400 font-medium">Local Controller</p>
        </footer>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-95 hidden transition-opacity duration-300">
        <div class="bg-gray-800 rounded-3xl p-6 w-full max-w-xs mx-4 shadow-2xl border border-gray-700 transform transition-transform duration-300 scale-100">
            <div class="flex flex-col items-center mb-6">
                <div class="w-12 h-12 bg-blue-500/20 rounded-full flex items-center justify-center mb-3 text-blue-400">
                    <span class="material-icons-round text-2xl">lock</span>
                </div>
                <h2 class="text-xl font-bold text-white text-center">Xác thực</h2>
                <p class="text-gray-400 text-sm text-center mt-1">Nhập mật khẩu để điều khiển</p>
            </div>
            
            <!-- Password Display -->
            <div class="mb-6 relative">
                <input type="password" id="password-display" readonly 
                    class="w-full bg-gray-900/50 text-white text-3xl text-center py-4 rounded-2xl border border-gray-700 focus:outline-none focus:border-blue-500/50 tracking-[0.5em] placeholder-gray-700 transition-colors" 
                    placeholder="••••">
                <p id="password-error" class="absolute -bottom-6 left-0 right-0 text-red-400 text-xs font-medium text-center opacity-0 transition-opacity">Mật khẩu không đúng</p>
            </div>

            <!-- Keypad -->
            <div class="grid grid-cols-3 gap-3">
                <button onclick="appendPassword('1')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">1</button>
                <button onclick="appendPassword('2')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">2</button>
                <button onclick="appendPassword('3')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">3</button>
                <button onclick="appendPassword('4')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">4</button>
                <button onclick="appendPassword('5')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">5</button>
                <button onclick="appendPassword('6')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">6</button>
                <button onclick="appendPassword('7')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">7</button>
                <button onclick="appendPassword('8')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">8</button>
                <button onclick="appendPassword('9')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">9</button>
                <button onclick="clearPassword()" class="aspect-square bg-red-500/10 hover:bg-red-500/20 active:bg-red-500/30 text-red-400 text-lg font-medium rounded-2xl transition-all flex items-center justify-center">
                    <span class="material-icons-round">backspace</span>
                </button>
                <button onclick="appendPassword('0')" class="aspect-square bg-gray-700 hover:bg-gray-600 active:bg-blue-600 active:scale-95 text-white text-2xl font-medium rounded-2xl transition-all shadow-lg shadow-gray-900/20">0</button>
                <button onclick="submitPassword()" class="aspect-square bg-blue-600 hover:bg-blue-500 active:bg-blue-700 active:scale-95 text-white text-lg font-medium rounded-2xl transition-all flex items-center justify-center shadow-lg shadow-blue-900/20">
                    <span class="material-icons-round">check</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
